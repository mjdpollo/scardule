name: Deploy SCARDULE

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SCARDULE_DEPLOY_KEY }}
          # 서버 체크아웃이 뒤처져 있어도 항상 origin/main 의 최신 배포 스크립트를 실행
          script: |
            set -e
            cd ~/scardule
            git fetch origin main
            bash -c "$(git show origin/main:scripts/deploy.sh)"
